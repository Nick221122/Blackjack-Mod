name: Build Blackjack Calculator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
      - name: Build mod and run tests
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify production mod JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_path="build/libs/blackjack-calculator-1.21.11.jar"

          echo "JAR files produced by Gradle:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print -exec ls -lh {} \;

          test -f "$jar_path"
          unzip -t "$jar_path"
          unzip -p "$jar_path" fabric.mod.json > /tmp/fabric.mod.json
          grep -q '"id"[[:space:]]*:[[:space:]]*"blackjackcalculator"' /tmp/fabric.mod.json

          echo "Verified mod metadata in $jar_path"
          cat /tmp/fabric.mod.json
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-calculator-1.21.11
          path: build/libs/blackjack-calculator-1.21.11.jar
          if-no-files-found: error
          retention-days: 14
