name: Build Blackjack Calculator

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2'
      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify production JAR
        run: test -f build/libs/blackjack-calculator-1.21.11.jar
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-calculator-1.21.11
          path: build/libs/blackjack-calculator-1.21.11.jar
