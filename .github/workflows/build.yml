name: Build Host Always Wins Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
      - name: Build mod
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify production JAR
        run: test -f build/libs/host-always-wins-1.21.11.jar
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: host-always-wins-1.21.11
          path: build/libs/host-always-wins-1.21.11.jar
