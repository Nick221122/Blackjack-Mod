name: Build Blackjack Calculator

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
      - name: Build mod and run tests
        run: gradle clean test remapJar --no-daemon --stacktrace
      - name: Verify production JAR
        run: |
          test -f build/libs/blackjack-calculator-1.21.11.jar
          if unzip -p build/libs/blackjack-calculator-1.21.11.jar META-INF/MANIFEST.MF | grep -q '^Fabric-Jar-Type: classes'; then
            echo 'Refusing to publish the development classes JAR; expected the remapped mod JAR.' >&2
            exit 1
          fi
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-calculator-1.21.11
          path: build/libs/blackjack-calculator-1.21.11.jar
