name: Build Blackjack Calculator

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build mod
        run: ./gradlew build --no-daemon
      - name: Verify production JAR
        run: test -f build/libs/blackjack-calculator-1.21.11.jar
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-calculator-1.21.11
          path: build/libs/blackjack-calculator-1.21.11.jar
