name: Build Blackjack Calculator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle 9.2.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.2.1'
      - name: Build mod and run tests
        run: gradle clean test remapJar --no-daemon --stacktrace
      - name: Find and verify production JAR
        id: production-jar
        shell: bash
        run: |
          set -euo pipefail
          echo "JAR files produced by Gradle:"
          find build/libs -maxdepth 1 -type f -name '*.jar' -print -exec ls -lh {} \;

          production_jar=""
          while IFS= read -r jar; do
            case "$jar" in
              *-sources.jar) continue ;;
            esac

            manifest="$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null || true)"
            if grep -q '^Fabric-Jar-Type: classes' <<< "$manifest"; then
              echo "Skipping development classes JAR: $jar"
              continue
            fi

            production_jar="$jar"
            break
          done < <(find build/libs -maxdepth 1 -type f -name '*.jar' | sort)

          if [[ -z "$production_jar" ]]; then
            echo "No production/remapped mod JAR found. See the JAR listing above." >&2
            exit 1
          fi

          echo "Selected production JAR: $production_jar"
          echo "jar_path=$production_jar" >> "$GITHUB_OUTPUT"
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: blackjack-calculator-1.21.11
          path: ${{ steps.production-jar.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 14
